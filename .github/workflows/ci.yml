name: CI

# Триггеры: пуши в main/staging и любые pull_request.
on:
  push:
    branches:
      - main
      - staging
  pull_request:

# Минимальные права: CI только читает репозиторий, секреты не нужны.
permissions:
  contents: read

jobs:
  # Обязательный job: типы, линт и юнит-тесты. Падение любого шага — красный статус.
  quality:
    name: Quality (types, lint, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # tests/ исключён из tsconfig.json, поэтому tsc проверяет только код приложения.
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # tests/unit/playwright.unit.config.ts — чистые юнит-тесты:
      # без браузера, dev-сервера и БД, поэтому `playwright install` не нужен.
      - name: Unit tests
        run: npm run test:unit

  # НЕ блокирует мерж: известные уязвимости (next, xlsx и транзитивные) ещё не устранены.
  # continue-on-error снимается после обновления Next.js и замены xlsx;
  # до тех пор отчёт npm audit остаётся видимым в логах шага (вывод не глушим).
  audit:
    name: Audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
